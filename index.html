<body>
  <div class="app">
    <div id="classes-panel" role="tabpanel" aria-labelledby="classes-tab">
    <header class="classes-header"><button id="studio-trigger" class="location studio-trigger" aria-haspopup="dialog" aria-controls="studio-picker"><span id="studio-label">BFT Holland Village</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><button id="header-profile" class="header-profile" aria-label="Open Bean Curd profile"><img src="bean-curd-unicorn.png" alt="" width="38" height="38"></button><h1>Classes</h1></header>
    <section class="calendar" aria-label="Choose a class date">
      <div class="week-controls"><button id="prev" aria-label="Previous week">‹</button><span id="week-label" aria-live="polite"></span><button id="next" aria-label="Next week">›</button></div>
      <div id="days" class="days" aria-label="Days of the week"><button id="today-button" type="button" aria-label="Go to today">Today</button></div>
    </section>
    <main>
      <div class="day-summary"><h2 id="selected-date"></h2><span id="class-count" class="count"></span></div>
      <ul id="timetable" class="sessions" aria-labelledby="selected-date"></ul>
    </main>
    </div>
    <div id="profile-panel" role="tabpanel" aria-labelledby="profile-tab" hidden>
      <header class="profile-header"><p class="location">Your account</p><h1>Profile</h1></header>
      <div class="profile-body">
        <div class="identity">
          <div class="avatar"><img src="bean-curd-unicorn.png" alt="Pixel unicorn avatar" width="86" height="86"></div>
          <h2>Bean Curd</h2><p>bean.curd@example.com</p>
        </div>
        <div class="profile-tabs" role="tablist" aria-label="Profile sections">
          <button id="details-tab" role="tab" aria-selected="true" aria-controls="details-panel">Details</button>
          <button id="stats-tab" role="tab" aria-selected="false" aria-controls="stats-panel" tabindex="-1">Stats</button>
        </div>
        <section id="details-panel" role="tabpanel" aria-labelledby="details-tab" tabindex="0">
          <div class="profile-card"><p class="field-label">Home gym</p><p class="home-name">BFT Holland Village</p></div>
        </section>
        <section id="stats-panel" role="tabpanel" aria-labelledby="stats-tab" tabindex="0" hidden>
          <div class="profile-card stats-card"><p class="field-label">Classes attended</p><p class="stat-number">590<span>classes</span></p></div>
        </section>
      </div>
    </div>
    <nav class="bottom-nav" role="tablist" aria-label="App navigation">
      <button id="classes-tab" class="nav-tab" role="tab" aria-selected="true" aria-controls="classes-panel"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 5h2m4 0h2"/></svg>Classes</button>
      <button id="profile-tab" class="nav-tab" role="tab" aria-selected="false" aria-controls="profile-panel" tabindex="-1"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>Profile</button>
    </nav>
  </div>
  <dialog id="studio-picker" aria-labelledby="studio-picker-title">
    <div class="picker-top"><div class="picker-heading"><h2 id="studio-picker-title">Choose a studio</h2><button class="close-picker" id="close-studio-picker" aria-label="Close studio picker">×</button></div>
    <label class="search-label" for="studio-search">Search studios</label><input id="studio-search" type="search" placeholder="Search by studio name" autocomplete="off" autofocus>
    <p id="search-status" class="search-status" role="status" aria-live="polite"></p></div>
    <ul id="studio-options" class="studio-options" aria-label="Studios"></ul>
  </dialog>
  <dialog id="class-detail" aria-labelledby="class-detail-title">
    <div class="picker-top class-heading"><div class="picker-heading"><h2 id="class-detail-title"></h2><button id="close-class-detail" class="close-picker" aria-label="Close class details">×</button></div></div>
    <div class="booking-content">
      <p id="booking-time-range" class="booking-time-range"></p>
      <p id="booking-day-date" class="booking-day-date"></p>
      <div id="booking-message" class="confirmation-banner" role="status" aria-live="polite" aria-atomic="true" hidden><strong id="confirmation-title"></strong><span id="confirmation-detail"></span></div>
      <div id="waitlist-only" class="waitlist-only" role="status" hidden><strong id="waitlist-title"></strong><span id="waitlist-position" hidden></span></div>
      <div class="detail-nav" aria-label="Browse classes for this day"><button id="previous-class" aria-label="Previous class time">‹</button><span id="class-time-position" aria-live="polite"></span><button id="next-class" aria-label="Next class time">›</button></div>
      <p id="booking-description" class="booking-description"></p>
      <div id="capacity-card" class="capacity-card"><div class="capacity-header"><strong id="booked-count"></strong><span id="spots-left"></span></div><progress id="capacity-progress" max="24" aria-label="Places booked"></progress></div>
      <button id="book-class" class="book-action">Book class</button>
      <div id="booked-actions" class="booking-extras" hidden><button id="tell-friend">Tell a friend</button><button id="add-calendar">Add to calendar</button></div>
      <button id="cancel-booking" class="cancel-action" hidden>Cancel booking</button>
      <div id="cancel-confirm" class="cancel-confirm" hidden><p id="cancel-question">Cancel your booking?</p><div class="booking-extras"><button id="keep-booking">Keep booking</button><button id="confirm-cancel">Yes, cancel</button></div></div>
      <div id="share-fallback" hidden><label for="share-text">Copy these class details to share</label><textarea id="share-text" readonly rows="4"></textarea></div>
      <p id="action-feedback" class="booking-message" role="status"></p>
      <p class="demo-note">Demo trainers, availability and bookings. Bookings reset when you refresh.</p>
    </div>
  </dialog>
  <script>
    // Summaries paraphrased from https://www.bodyfittraining.com/sessions
    const descriptions = {
      'Cardio HIIT':'Short bursts of vigorous cardio alternate with recovery breaks. The session uses an intermittent format rather than continuous effort.',
      'Pump':'A resistance workout with repeated sets focused on specific muscles. Sessions concentrate on either the upper or lower body.',
      'Summit':'A cardio session focused on aerobic endurance and sustained effort. The emphasis is on maintaining a manageable pace rather than reaching maximum intensity.',
      'Strength':'A weights session built around developing strength. Longer breaks between sets allow recovery between lifts.',
      'Cardio U':'A cardio workout that changes intensity over longer work intervals. The format explores how effort and recovery affect your heart rate.',
      'Hyper':'Resistance exercises emphasise controlled technique and single-sided movements. Repeated sets develop strength through a range of movement patterns.',
      'Shred':'A session that combines weights with cardio exercises. The format develops strength alongside aerobic conditioning.',
      'Balanced':'A full-body session focused on mobility, balance and joint stability. Controlled movement and breathing guide the exercises.',
      'Strength Endurance':'Weights and cardio are combined to develop sustained strength. The session varies the effort across both types of exercise.',
      'Power':'A session centred on quick, dynamic movements. Exercises focus on producing force with speed.'
    };
    function descriptionFor(name){return descriptions[name.split(' (')[0]]||'';}
    const programmeRows=[
      ['Cardio HIIT|411','Pump (Lower body)|276','Summit|406','Strength (Upper body)|506','Cardio U|51','Power|218'],
      ['Cardio U (Aerobic)|174','Pump (Upper body)|277','Cardio HIIT|412','Strength (Upper body)|507','Summit|407','Shred (Mixed)|251'],
      ['Strength (Lower body)|508','Summit|408','Pump (Upper body)|278','Cardio HIIT|413','Balanced|254','Power|219'],
      ['Shred|252','Hyper (Mixed)|113','Cardio U (Aerobic)|175','Strength (Upper body)|509','Cardio HIIT|414','Strength Endurance|197'],
      ['Power|220','Summit|409','Hyper (Upper body)|117','Cardio HIIT|415','Balanced|255','Strength (Mixed)|510'],
      ['Strength Endurance|198','Cardio U|52','Hyper (Lower body)|107','Summit|410','Strength (Upper body)|511','Cardio HIIT|416'],
      ['Cardio U|53','Strength (Upper body)|512','Cardio HIIT|417','Hyper (Lower body)|108','Summit|411','Power|221'],
      ['Hyper (Upper body)|118','Cardio HIIT|418','Strength (Lower body)|513','Shred|253','Balanced|256','Strength Endurance|199']
    ];
    const programme=new Map();
    programmeRows.forEach((row,week)=>row.forEach((entry,day)=>{
      const date=new Date('2026-09-21T12:00:00Z');date.setUTCDate(date.getUTCDate()+week*7+day);
      const [className,code]=entry.split('|');programme.set(date.toISOString().slice(0,10),{className,code});
    }));
    const demoBookings=new Set();
    const demoWaitlists=new Set();
    const calendarExports=new Set();
    const trainerRosters={
      'BFT Holland Village':['Alvin','Wendy','Crystal','Edwin','Kelvin','Zara'],
      'BFT One North':['Sherman','Tammy','Hui Qian','Kelvin','Dzul','Aaron'],
      'BFT Kent Ridge':['Daniel','Rachel','Isaac','Chloe'],
      'BFT Harbourfront':['Marcus','Joanne','Ryan','Sophie'],
      'BFT Tanglin':['Adrian','Nicole','Ethan','Jasmine'],
      'BFT Balestier':['Aaron','Grace','Sean','Dawn'],
      'BFT Orchard':['Brandon','Michelle','Darren','Faith'],
      'BFT Bukit Timah':['Joshua','Clara','Ben','Lydia'],
      'BFT Beauty World':['Lucas','Natalie','Joel','Amanda']
    };
    let activeSession=null;
    const detailDialog=document.getElementById('class-detail');
    function createSession(date,time,className,studio,index){
      const dateKey=date.toISOString().slice(0,10);
      const code=programme.get(dateKey)?.code;
      const key=`${studio}|${dateKey}|${time}`;
      let hash=0;for(const c of key)hash=(hash*31+c.charCodeAt(0))>>>0;
      const typical=time==='12:00'?8:time==='18:15'?21:time==='07:15'?19:14;
      const base=(time==='18:15'||time==='08:45')?24:Math.min(23,Math.max(5,typical+(hash%9)-4));
      const roster=trainerRosters[studio];
      const dayIndex=(date.getUTCDay()+6)%7;
      const morningIndex=dayIndex%roster.length;
      const trainer=roster[(morningIndex+(time>='17:00'?Math.max(1,Math.floor(roster.length/2)):0))%roster.length];
      const waitBase=base===24?hash%6:0;
      return {key,dateKey,time,className,code,studio,base,trainer,waitBase,start:Date.parse(`${dateKey}T${time}:00+08:00`)};
    }
    function bookingWindow(session){
      const bookingDay=Date.parse(session.dateKey+'T00:00:00+08:00');
      const currentDay=Date.parse(singaporeToday().toISOString().slice(0,10)+'T00:00:00+08:00');
      const daysAhead=Math.round((bookingDay-currentDay)/86400000);
      const opens=new Date(bookingDay-13*86400000+8*3600000);
      return {open:daysAhead>=0&&daysAhead<14,opens:opens.toISOString().slice(0,10)};
    }
    function sessionStatus(session){
      const booked=demoBookings.has(session.key);
      const count=session.base+(booked?1:0);
      const waitlisted=demoWaitlists.has(session.key);
      return {booked,count,waitlisted,waitCount:session.waitBase+(waitlisted?1:0),past:session.start<=Date.now(),full:count>=24,bookingOpen:bookingWindow(session).open};
    }
    function bookSession(session){
      const state=sessionStatus(session);
      if(state.booked||state.waitlisted||state.full||state.past||!state.bookingOpen)return false;
      demoBookings.add(session.key);return true;
    }
    function joinWaitlist(session){
      const state=sessionStatus(session);if(state.past||state.booked||state.waitlisted||!state.full||!state.bookingOpen||state.waitCount>=20)return false;
      demoWaitlists.add(session.key);return true;
    }
    function cancelSession(session){return demoBookings.delete(session.key)||demoWaitlists.delete(session.key);}
    function calendarText(session){
      const escape=value=>value.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
      const stamp=date=>date.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
      return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gym prototype//Class booking//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',`UID:${encodeURIComponent(session.key)}@gym-prototype`,`DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(new Date(session.start))}`,`SUMMARY:${escape(session.className+' — '+session.studio)}`,`LOCATION:${escape(session.studio)}`,`DESCRIPTION:${escape('Demo booking. Trainer: '+session.trainer+'. '+descriptionFor(session.className))}`,'END:VEVENT','END:VCALENDAR',''].join('\r\n');
    }
    function refreshDetails(){
      const s=activeSession,state=sessionStatus(s);
      document.getElementById('class-detail-title').textContent=s.className;
      const totalMinutes=Number(s.time.slice(0,2))*60+Number(s.time.slice(3))+(new Date(s.dateKey+'T12:00:00Z').getUTCDay()===6?60:50);
      const end=`${String(Math.floor(totalMinutes/60)%24).padStart(2,'0')}:${String(totalMinutes%60).padStart(2,'0')}`;
      document.getElementById('booking-time-range').textContent=`${s.time} to ${end}`;
      document.getElementById('booking-day-date').textContent=new Intl.DateTimeFormat('en-SG',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Singapore'}).format(new Date(s.start));
      document.getElementById('booking-description').textContent=descriptionFor(s.className);
      const dayTimes=new Date(s.dateKey+'T12:00:00Z').getUTCDay()===6?saturdayTimes:weekdayTimes;const position=dayTimes.indexOf(s.time);
      document.getElementById('previous-class').disabled=position<=0;document.getElementById('next-class').disabled=position>=dayTimes.length-1;document.getElementById('class-time-position').textContent=`${position+1} of ${dayTimes.length}`;
      document.getElementById('booked-count').textContent=`${state.count}/24 booked`;
      document.getElementById('capacity-progress').value=state.count;
      const remaining=24-state.count;
      document.getElementById('spots-left').textContent=remaining===0?'No places available':`${remaining} ${remaining===1?'place':'places'} available`;
      document.getElementById('capacity-card').hidden=state.full||!state.bookingOpen&&!state.booked&&!state.waitlisted;
      const notice=document.getElementById('waitlist-only');notice.hidden=!(state.full&&state.bookingOpen&&!state.past);
      document.getElementById('waitlist-title').textContent=`WAITLIST ONLY: ${state.waitCount}/20 people waitlisted`;
      const waitPosition=document.getElementById('waitlist-position');waitPosition.hidden=!state.waitlisted;waitPosition.textContent=state.waitlisted?`You’re number ${state.waitCount} in the queue.`:'';
      const action=document.getElementById('book-class');
      action.disabled=state.booked||state.waitlisted||state.past||!state.bookingOpen||state.full&&state.waitCount>=20;
      action.textContent=state.booked?'Booked':state.waitlisted?'On waitlist':state.past?'Class completed':!state.bookingOpen?`Bookings open ${new Intl.DateTimeFormat('en-SG',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(bookingWindow(s).opens+'T12:00:00Z'))}`:state.full&&state.waitCount>=20?'Waitlist full':state.full?'Join waitlist':'Book class';
      const message=document.getElementById('booking-message');message.hidden=!state.booked;
      message.dataset.state='booked';
      document.getElementById('confirmation-title').textContent=state.booked?'✓ Booking confirmed':'';
      document.getElementById('confirmation-detail').textContent=state.booked?'Your place in this class is reserved.':'';
      document.getElementById('booked-actions').hidden=!state.booked;
      const cancel=document.getElementById('cancel-booking');cancel.hidden=!(state.booked||state.waitlisted)||state.past;
      cancel.textContent=state.waitlisted?'Leave waitlist':'Cancel booking';
    }
    function openClass(session){activeSession=session;document.getElementById('cancel-confirm').hidden=true;document.getElementById('share-fallback').hidden=true;document.getElementById('action-feedback').textContent='';refreshDetails();if(!detailDialog.open)detailDialog.showModal();detailDialog.scrollTo({top:0,behavior:'instant'});}
    function shiftClass(step){
      if(!activeSession)return;const s=activeSession;const date=new Date(s.dateKey+'T12:00:00Z');const times=date.getUTCDay()===6?saturdayTimes:weekdayTimes;const index=times.indexOf(s.time)+step;
      if(index<0||index>=times.length)return;openClass(createSession(date,times[index],s.className,s.studio,index));
    }
    document.getElementById('previous-class').addEventListener('click',()=>shiftClass(-1));
    document.getElementById('next-class').addEventListener('click',()=>shiftClass(1));
    document.getElementById('close-class-detail').addEventListener('click',()=>detailDialog.close());
    document.getElementById('book-class').addEventListener('click',()=>{if(activeSession){sessionStatus(activeSession).full?joinWaitlist(activeSession):bookSession(activeSession);document.getElementById('action-feedback').textContent='';render();refreshDetails();detailDialog.scrollTo({top:0,behavior:'instant'});}});
    document.getElementById('cancel-booking').addEventListener('click',()=>{const waiting=sessionStatus(activeSession).waitlisted;document.getElementById('cancel-question').textContent=waiting?'Leave the waitlist?':'Cancel your booking?';document.getElementById('keep-booking').textContent=waiting?'Stay on waitlist':'Keep booking';document.getElementById('cancel-confirm').hidden=false;document.getElementById('keep-booking').focus();});
    document.getElementById('keep-booking').addEventListener('click',()=>{document.getElementById('cancel-confirm').hidden=true;document.getElementById('cancel-booking').focus();});
    document.getElementById('confirm-cancel').addEventListener('click',()=>{
      const waiting=sessionStatus(activeSession).waitlisted;cancelSession(activeSession);document.getElementById('cancel-confirm').hidden=true;document.getElementById('share-fallback').hidden=true;render();refreshDetails();
      document.getElementById('action-feedback').textContent=waiting?'You’ve left the waitlist.':'Booking cancelled.'+(calendarExports.has(activeSession.key)?' Remove the event from your calendar separately.':'');document.getElementById('book-class').focus();
    });
    document.getElementById('tell-friend').addEventListener('click',async()=>{
      const s=activeSession;if(!sessionStatus(s).booked)return;
      const text=`I’ve booked ${s.className} at ${s.studio} on ${s.dateKey} at ${s.time} (Singapore time), with ${s.trainer}. Want to join? This is a demo booking.`;
      const fallback=()=>{document.getElementById('share-fallback').hidden=false;const field=document.getElementById('share-text');field.value=text;field.focus();field.select();};
      try{if(navigator.share){await navigator.share({title:s.className+' at '+s.studio,text});}else if(navigator.clipboard){await navigator.clipboard.writeText(text);document.getElementById('action-feedback').textContent='Class details copied. Paste them into a message to your friend.';}else fallback();}catch(error){if(error.name!=='AbortError')fallback();}
    });
    document.getElementById('add-calendar').addEventListener('click',()=>{
      if(!sessionStatus(activeSession).booked)return;
      const url=URL.createObjectURL(new Blob([calendarText(activeSession)],{type:'text/calendar;charset=utf-8'}));
      const link=document.createElement('a');link.href=url;link.download=`${activeSession.className.replace(/ /g,'-')}-${activeSession.dateKey}.ics`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);calendarExports.add(activeSession.key);
      document.getElementById('action-feedback').textContent='Calendar file ready. Open it to add the class to your calendar.';
    });
    detailDialog.addEventListener('close',()=>{const button=Array.from(document.querySelectorAll('[data-session]')).find(el=>el.dataset.session===activeSession?.key);if(button)button.focus();});
    const homeStudio = 'BFT Holland Village';
    const studios = ['BFT One North','BFT Kent Ridge','BFT Harbourfront','BFT Tanglin','BFT Balestier','BFT Orchard','BFT Bukit Timah','BFT Beauty World',homeStudio].sort((a,b)=>a.localeCompare(b,'en'));
    let selectedStudio = homeStudio;
    const picker=document.getElementById('studio-picker');
    const search=document.getElementById('studio-search');
    function renderStudios(){
      const query=search.value.trim().toLowerCase();
      const matches=studios.filter(name=>name.toLowerCase().includes(query));
      const list=document.getElementById('studio-options');list.replaceChildren();
      document.getElementById('search-status').textContent=`${matches.length} ${matches.length===1?'studio':'studios'}`;
      if(!matches.length){const empty=document.createElement('li');empty.className='empty-studios';empty.textContent='No studios found. Try another name.';list.append(empty);}
      matches.forEach(name=>{
        const row=document.createElement('li');const button=document.createElement('button');button.className='studio-option';
        button.setAttribute('aria-pressed',String(name===selectedStudio));
        const label=document.createElement('span');label.textContent=name;
        if(name===homeStudio){const home=document.createElement('small');home.textContent='Home gym';label.append(home);}
        const check=document.createElement('span');check.className='check';check.setAttribute('aria-hidden','true');check.textContent=name===selectedStudio?'✓':'';
        button.append(label,check);button.addEventListener('click',()=>{
          selectedStudio=name;
          document.getElementById('studio-label').textContent=name;
          document.getElementById('studio-trigger').setAttribute('aria-label',`Change studio, currently ${name}`);
          render();picker.close();
        });row.append(button);list.append(row);
      });
    }
    document.getElementById('studio-trigger').setAttribute('aria-label',`Change studio, currently ${homeStudio}, home gym`);
    document.getElementById('header-profile').addEventListener('click',()=>document.getElementById('profile-tab').click());
    document.getElementById('studio-trigger').addEventListener('click',()=>{search.value='';renderStudios();picker.showModal();search.focus();});
    document.getElementById('close-studio-picker').addEventListener('click',()=>picker.close());
    picker.addEventListener('close',()=>document.getElementById('studio-trigger').focus());
    picker.addEventListener('click',event=>{if(event.target===picker){const r=picker.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)picker.close();}});
    search.addEventListener('input',renderStudios);
    const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(name=>({name}));
    const weekdayTimes = ['06:10','07:15','08:20','12:00','17:10','18:15','19:20'];
    const saturdayTimes = ['07:30','08:45','10:00','11:15'];
    function singaporeToday(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return new Date(parts+'T12:00:00Z');}
    let today=singaporeToday();
    function mondayFor(date){const result=new Date(date);result.setUTCDate(date.getUTCDate()-((date.getUTCDay()+6)%7));return result;}
    let currentMonday=mondayFor(today);
    let weekOffset=0;
    let selectedDay=(today.getUTCDay()+6)%7;
    const lastMonday=new Date('2026-11-09T12:00:00Z');
    function maxWeekOffset(){return Math.max(0,Math.round((lastMonday-currentMonday)/604800000));}
    function syncToday(){const latest=singaporeToday();if(latest.getTime()!==today.getTime()){const shown=currentMonday.getTime()+weekOffset*604800000;today=latest;currentMonday=mondayFor(today);weekOffset=Math.max(0,Math.round((shown-currentMonday)/604800000));if(detailDialog.open)detailDialog.close();}}
    const formatDay = d => new Intl.DateTimeFormat('en-SG',{timeZone:'UTC',day:'numeric',month:'short'}).format(d);
    function render() {
      syncToday();weekOffset=Math.min(maxWeekOffset(),Math.max(0,weekOffset));
      document.getElementById("prev").disabled=weekOffset===0;document.getElementById("next").disabled=weekOffset>=maxWeekOffset();
      const monday = new Date(currentMonday); monday.setUTCDate(monday.getUTCDate()+weekOffset*7);
      const saturday = new Date(monday); saturday.setUTCDate(saturday.getUTCDate()+6);
      document.getElementById('week-label').textContent = `${formatDay(monday)} – ${formatDay(saturday)} ${saturday.getUTCFullYear()}`;
      const strip = document.getElementById('days');
      if(strip.children.length===1){days.forEach((item,index)=>{
        const button = document.createElement('button'); button.className='day-button';
        button.addEventListener('click',()=>{selectedDay=index;render()});
        const label=document.createElement('span'); label.textContent=item.name.slice(0,3);
        const number=document.createElement('strong'); button.append(label,number); strip.append(button);
      });}
      days.forEach((item,index)=>{
        const date=new Date(monday);date.setUTCDate(date.getUTCDate()+index);
        const button=strip.children[index+1];button.lastElementChild.textContent=date.getUTCDate();
        button.setAttribute('aria-pressed',String(index===selectedDay));
        button.setAttribute('aria-label',`${item.name}, ${formatDay(date)}, ${programme.get(date.toISOString().slice(0,10))?.className||"No scheduled classes"}`);
        if(date.getTime()===today.getTime()) button.setAttribute('aria-current','date'); else button.removeAttribute('aria-current');
      });
      const date=new Date(monday);date.setUTCDate(date.getUTCDate()+selectedDay);
      const selected={name:days[selectedDay].name,...programme.get(date.toISOString().slice(0,10))};
      document.getElementById('selected-date').textContent=`${selected.name}, ${formatDay(date)}`;
      const times=!selected.className?[]:selectedDay===5?saturdayTimes:weekdayTimes;
      document.getElementById('class-count').textContent=`${times.length} classes`;
      const list=document.getElementById('timetable');list.replaceChildren();
      if(!times.length){const empty=document.createElement('li');empty.className='empty-day';empty.textContent=selectedDay===6?'No classes on Sunday.':'No schedule available for this date.';list.append(empty);} 
      times.forEach((time,index)=>{
        const session=createSession(date,time,selected.className,selectedStudio,index);
        const state=sessionStatus(session);
        const row=document.createElement('li');
        const button=document.createElement('button');button.className='session';button.dataset.session=session.key;button.dataset.booked=String(state.booked);button.dataset.waitlisted=String(state.waitlisted);button.dataset.past=String(state.past);button.disabled=state.past;if(!state.past)button.setAttribute('aria-haspopup','dialog');
        button.addEventListener('click',()=>openClass(session));
        const timeWrap=document.createElement('span');timeWrap.className='time-wrap';
        const start=document.createElement('time');start.className='time';start.textContent=time;start.dateTime=time;
        const duration=document.createElement('span');duration.className='duration';duration.textContent=selectedDay===5?'1 hr':'50 min';timeWrap.append(start,duration);
        const details=document.createElement('span');details.className='session-details';
        const name=document.createElement('span');name.className='class-name';name.textContent=selected.className;
        const availability=document.createElement('span');availability.className='availability';
        if(!state.bookingOpen&&!state.past&&!state.booked&&!state.waitlisted){
          availability.textContent=`Bookings open ${new Intl.DateTimeFormat('en-SG',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(bookingWindow(session).opens+'T12:00:00Z'))}`;
        }else if(state.booked) availability.textContent=`${state.count}/24 booked`;
        else if(state.waitlisted) availability.textContent=`You’re #${state.waitCount}`;
        else if(!state.full&&!state.past) availability.textContent=`${state.count}/24 booked`;
        const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='›';arrow.setAttribute('aria-hidden','true');
        const trainer=document.createElement('span');trainer.className='trainer-label';trainer.textContent=`Trainer: ${session.trainer}`;
        if(!state.past&&(state.booked||state.waitlisted||state.full&&state.bookingOpen)){
          const badge=document.createElement('span');badge.className='status-badge'+(!state.booked?' waitlisted':'');
          badge.textContent=state.booked?'✓ BOOKED':`WAITLIST · ${state.waitCount} waiting`;details.append(badge);
        }
        details.append(name,trainer,availability);button.append(timeWrap,details,arrow);row.append(button);list.append(row);
      });
    }
    document.getElementById('prev').addEventListener('click',()=>{weekOffset=Math.max(0,weekOffset-1);render()});
    document.getElementById('next').addEventListener('click',()=>{weekOffset=Math.min(maxWeekOffset(),weekOffset+1);render()});
    document.getElementById('today-button').addEventListener('click',()=>{syncToday();weekOffset=0;selectedDay=(today.getUTCDay()+6)%7;render();});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
    setInterval(()=>{if(singaporeToday().getTime()!==today.getTime())render();},30000);
    render();
    function connectTabs(tabIds, onSelect) {
      const tabs=tabIds.map(id=>document.getElementById(id));
      function select(tab) {
        tabs.forEach(item=>{
          const active=item===tab;
          item.setAttribute('aria-selected',String(active));item.tabIndex=active?0:-1;
          document.getElementById(item.getAttribute('aria-controls')).hidden=!active;
        });
        if(onSelect)onSelect();
      }
      tabs.forEach((tab,index)=>{
        tab.addEventListener('click',()=>select(tab));
        tab.addEventListener('keydown',event=>{
          let next;
          if(event.key==='ArrowRight')next=(index+1)%tabs.length;
          else if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;
          else if(event.key==='Home')next=0;
          else if(event.key==='End')next=tabs.length-1;
          else return;
          event.preventDefault();select(tabs[next]);tabs[next].focus();
        });
      });
    }
    connectTabs(['classes-tab','profile-tab'],()=>window.scrollTo({top:0,behavior:'instant'}));
    connectTabs(['details-tab','stats-tab']);
  </script>
